name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (no warnings allowed)
        run: npx eslint . --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations follow the grants convention
        run: npm run check:migrations

      # Faza 3: Edge Functions push-dispatch / push-receipts (Deno) — testele unitare + verificarea tipurilor.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Functions (Deno) tests and typecheck
        run: |
          deno test supabase/functions/push-dispatch supabase/functions/push-receipts supabase/functions/_shared supabase/functions/apple-link supabase/functions/storage-gc supabase/functions/delete-account supabase/functions/report-public supabase/functions/cleanup-announcements
          deno check supabase/functions/push-dispatch/index.ts supabase/functions/push-receipts/index.ts supabase/functions/apple-link/index.ts supabase/functions/storage-gc/index.ts supabase/functions/delete-account/index.ts supabase/functions/report-public/index.ts supabase/functions/cleanup-announcements/index.ts

  db-tests:
    # Faza 0.3 + 0.3-bis (PLAN_1.1_FIX, 26–31 oct 2026), un singur job, în ordinea în care a evoluat producția:
    #   1. doar baseline-ul (20261031000300) aplicat de la zero pe un Postgres Supabase local (supabase start);
    #   2. paritatea cu producția (supabase/baseline/parity.sql vs parity.expected.txt) — dovada că baseline-ul
    #      reproduce exact schema de producție de la 29 oct 2026; expected.txt e legat de baseline și NU se
    #      regenerează când migrările noi ajung în producție;
    #   3. migrările de după baseline, aplicate incremental (supabase migration up --local), exact ca pe producție;
    #   4. testele pgTAP din supabase/tests/ pe schema completă.
    # Migrările noi NU se verifică prin paritate (ar ieși roșu prin construcție cât nu sunt aplicate în producție),
    # ci prin repetiția pe producție (amprenta catalogului + măsurătorile de oaspete) și prin pgTAP.
    # Un singur `supabase start` pe job: imaginile vin de pe public.ecr.aws, cu limită pe pull-urile anonime.
    # Serviciile grele sunt excluse: aici contează doar baza (auth și storage rămân pornite — schemele
    # auth.users și storage.objects/buckets sunt create de ele).
    name: Migrations, parity & pgTAP
    runs-on: ubuntu-latest
    env:
      # Aceeași identitate e și în scripts/check-migrations.mjs (BASELINE_VERSION): se schimbă împreună.
      BASELINE_FILE: 20261031000300_baseline_production_schema.sql
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Set aside the migrations after the baseline
        # `supabase start` aplică tot ce găsește în supabase/migrations/; pentru paritate vrem doar baseline-ul.
        # Fișierele se mută în afara folderului supabase/ și revin la pasul 3.
        run: |
          mkdir -p /tmp/pending
          find supabase/migrations -maxdepth 1 -name '*.sql' ! -name "$BASELINE_FILE" -exec mv -t /tmp/pending {} +
          test -f "supabase/migrations/$BASELINE_FILE"
          echo "pending after baseline: $(ls /tmp/pending | wc -l)"; ls /tmp/pending || true

      - name: Start local Postgres and apply the baseline
        id: start
        # Imaginile vin de pe public.ecr.aws, care limitează pull-urile anonime (toomanyrequests în run 40853794809);
        # trei încercări cu pauză înainte de a declara eșec.
        run: |
          for attempt in 1 2 3; do
            if supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,realtime,supavisor,postgres-meta; then
              exit 0
            fi
            echo "supabase start failed (attempt $attempt)"; supabase stop --no-backup || true; sleep 45
          done
          exit 1

      - name: Match platform settings that are not migrations
        # Producția nu are pg_graphql (dezactivat din Dashboard; checklist-ul 14 o cere). Local vine pornit;
        # îl scoatem ca supabase_admin (owner-ul extensiei), înainte de paritate și pgTAP.
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -c "DROP EXTENSION IF EXISTS pg_graphql;"

      - name: Schema parity with production (baseline only)
        # Aceeași interogare pe Postgres-ul local trebuie să dea exact rândurile obținute pe producție la 29 oct 2026
        # (scripts/baseline-parity-expected.mjs). Orice diferență = baseline-ul nu reproduce producția.
        env:
          PGCLIENTENCODING: UTF8
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -A -t -v ON_ERROR_STOP=1 \
            -f supabase/baseline/parity.sql | tr -d '\r' > /tmp/parity.actual.txt
          tr -d '\r' < supabase/baseline/parity.expected.txt > /tmp/parity.expected.txt
          diff -u /tmp/parity.expected.txt /tmp/parity.actual.txt

      # ── Poarta 4.1 (PLAN_1.1_FIX, faza 4): cererile reale 1.0.x, înainte și după migrările de după baseline ──
      # Fixturile (supabase/gate/fixtures.sql) sunt DATE, nu schemă: paritatea de mai sus nu le vede.
      # Pașii porții și repetiția de rollback rulează doar când există migrări după baseline.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        with:
          node-version: 22

      - name: Gate 4.1 fixtures and fingerprint before
        id: gate_before
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          PGCLIENTENCODING: UTF8
        run: |
          if [ -z "$(ls -A /tmp/pending)" ]; then echo "no migrations after the baseline: gate skipped"; exit 0; fi
          set -o pipefail
          mkdir -p /tmp/gate /tmp/fp
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/gate/fixtures.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/gate/fingerprint.sql | tr -d '\r' > /tmp/fp/baseline.txt
          wc -l /tmp/fp/baseline.txt
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/replay-1_0_8.mjs run --phase before --out /tmp/gate/before
          # Valorile după scrieri (plăcuță/VIN/coordonate intacte etc.), apoi urmele scrierilor dispar, ca „after”
          # să vadă aceleași date (comparăm numărul de rânduri).
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/gate/post-check.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/gate/cleanup.sql

      - name: Apply the migrations after the baseline
        # Revin în supabase/migrations/ și se aplică incremental pe baza locală (istoricul local are baseline-ul);
        # toate au versiunea > baseline (check-migrations o impune). Fără fișiere = pas gol.
        # Durata e măsurată (David: durata tranzacției se raportează înainte de repetiția pe producție);
        # include și overhead-ul CLI-ului — măsura exactă e în pasul de rollback (psql \timing).
        id: apply
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          if [ -n "$(ls -A /tmp/pending)" ]; then
            mv /tmp/pending/*.sql supabase/migrations/
            start=$(date +%s%N)
            supabase migration up --local
            echo "migration up --local: $(( ($(date +%s%N) - start) / 1000000 )) ms (inclusiv CLI)"
          else
            echo "no migrations after the baseline"
          fi

      - name: Gate 4.1 replay after and compare
        # Cache-ul de schemă al PostgREST se reîncarcă sigur prin restartul containerului (NOTIFY pgrst din
        # migrare rămâne pentru producție, unde nu putem restarta). Cod 2 = hint-ul `profiles!driver_id` nu
        # rezolvă prin view → STOP și raport către David (D1 = (a), fără varianta (iii) aleasă de Claude).
        if: ${{ !cancelled() && steps.gate_before.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: |
          if [ ! -d /tmp/gate/before ]; then echo "gate skipped"; exit 0; fi
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          docker restart $(docker ps -q --filter name=supabase_rest_)
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON_KEY" "$API_URL/rest/v1/" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi; sleep 2
          done
          [ "$ready" = "1" ] || { echo "PostgREST nu a răspuns 200 după restart"; exit 1; }
          node scripts/replay-1_0_8.mjs run --phase after --out /tmp/gate/after
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/gate/post-check.sql
          node scripts/replay-1_0_8.mjs compare /tmp/gate/before /tmp/gate/after

      - name: Rollback rehearsal (migrations after the baseline)
        # David (§8-bis.3): rollback-ul se testează înainte de producție; fără Docker local, singurul banc e aici.
        # Amprenta „după rollback” trebuie să fie identică cu cea de dinainte de migrare; apoi migrarea se
        # re-aplică cu psql (durata exactă a tranzacției, \timing) și amprenta trebuie să revină la „după migrare”.
        if: ${{ !cancelled() && steps.gate_before.outcome == 'success' && steps.apply.outcome == 'success' }}
        env:
          PGCLIENTENCODING: UTF8
        run: |
          if [ ! -f /tmp/fp/baseline.txt ]; then echo "no migrations after the baseline: rehearsal skipped"; exit 0; fi
          set -o pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fp() { psql "$DB" -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/gate/fingerprint.sql | tr -d '\r' > "$1"; }
          fp /tmp/fp/applied.txt
          # Schimbarea de catalog pe care o fac migrările (baseline → applied): e referința pentru repetiția pe
          # producție (diferența din BEGIN … migrări … ROLLBACK trebuie să fie aceeași); artefactul `fingerprints`.
          diff -u /tmp/fp/baseline.txt /tmp/fp/applied.txt > /tmp/fp/expected-change.diff || true
          echo "schimbări de catalog baseline → applied: $(grep -c '^[-+][^-+]' /tmp/fp/expected-change.diff) linii (artefactul fingerprints/expected-change.diff)"
          for f in $(ls supabase/migrations/*.sql | grep -v "$BASELINE_FILE" | sort -r); do
            rb="supabase/rollback/$(basename "$f")"
            test -f "$rb" || { echo "lipsește rollback-ul $rb"; exit 1; }
            echo "rollback: $rb"
            psql "$DB" -X -q -1 -v ON_ERROR_STOP=1 -f "$rb"
          done
          fp /tmp/fp/rolled_back.txt
          echo "diff baseline vs rolled back (trebuie gol):"
          diff -u /tmp/fp/baseline.txt /tmp/fp/rolled_back.txt
          for f in $(ls supabase/migrations/*.sql | grep -v "$BASELINE_FILE" | sort); do
            start=$(date +%s%N)
            psql "$DB" -X -q -1 -v ON_ERROR_STOP=1 -f "$f"
            echo "re-apply $f: $(( ($(date +%s%N) - start) / 1000000 )) ms (o singură tranzacție psql -1)"
          done
          fp /tmp/fp/reapplied.txt
          # Poziția fizică a coloanei (attnum) e scoasă DOAR din această comparație: o coloană adăugată cu ALTER TABLE,
          # scoasă de rollback și adăugată din nou primește alt număr (coloanele șterse își păstrează locul în catalog),
          # deci diferența e un artefact al repetiției, nu al migrării (CI 42828016579, faza 8: reports.source 15 → 19).
          # Numele, tipul, NOT NULL și default-ul coloanei rămân comparate; amprentele brute sunt în artefact.
          noattnum() { sed -E 's/^(column \| [^|]+ \| )[0-9]+\|/\1/' "$1"; }
          echo "diff applied vs re-applied, fără attnum (trebuie gol):"
          diff -u <(noattnum /tmp/fp/applied.txt) <(noattnum /tmp/fp/reapplied.txt)

      - name: "Faza 3: măsurători la scară (10 000 membri în canal; raportate, nu asserturi)"
        # Condiția lui David din 25 oct (PLAN_1.1_FIX §3 „Teste”): INSERT în channel_messages ≤ 50 ms și
        # build_channel_digests() < 2 s, măsurate cu \timing pe baza din CI cu toate migrările aplicate (după
        # rehearsal starea e „re-aplicat”). O singură tranzacție cu ROLLBACK, nimic nu rămâne pentru pgTAP.
        # Fără faza 3 în migrări pasul doar scrie „sărit”. Depășirea țintei = ::warning:: în log, NU eșec (David decide).
        if: ${{ !cancelled() && steps.start.outcome == 'success' && steps.apply.outcome == 'success' }}
        env:
          PGCLIENTENCODING: UTF8
        run: |
          set -o pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -X -v ON_ERROR_STOP=1 -f supabase/bench/channel_push_timing.sql | tr -d '\r' | tee /tmp/bench.out
          if grep -q 'masuratoarea e sarita' /tmp/bench.out; then exit 0; fi
          # Liniile „Time: N ms” apar în ordinea măsurătorilor: 1 = INSERT channel_messages, 2 = build_channel_digests().
          insert_ms=$(grep -E '^Time: ' /tmp/bench.out | sed -n '1p' | awk '{print $2}')
          digest_ms=$(grep -E '^Time: ' /tmp/bench.out | sed -n '2p' | awk '{print $2}')
          members=$(grep -A2 'bench_members_with_push' /tmp/bench.out | tail -1 | tr -d ' ')
          digest_rows=$(grep -A2 'bench_digest_rows' /tmp/bench.out | tail -1 | tr -d ' ')
          echo "FAZA 3 MĂSURĂTORI: membri cu push=$members | INSERT channel_messages=${insert_ms} ms (țintă ≤ 50) | build_channel_digests=${digest_ms} ms (țintă < 2000), rânduri în coadă=$digest_rows"
          [ -n "$insert_ms" ] && [ -n "$digest_ms" ] || { echo "::warning::bench: nu am găsit ambele linii Time: în ieșire"; exit 0; }
          awk -v v="$insert_ms" 'BEGIN { exit !(v > 50) }' && echo "::warning::Faza 3: INSERT channel_messages ${insert_ms} ms > ținta de 50 ms (de raportat lui David, nu se repară aici)"
          awk -v v="$digest_ms" 'BEGIN { exit !(v > 2000) }' && echo "::warning::Faza 3: build_channel_digests ${digest_ms} ms > ținta de 2000 ms (de raportat lui David)"
          exit 0

      - name: Upload fingerprints
        # Amprentele și diferența așteptată (baseline → applied): referința cu care se compară repetiția BEGIN … ROLLBACK pe producție.
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: fingerprints
          path: /tmp/fp/
          if-no-files-found: ignore
          retention-days: 14

      - name: pgTAP tests
        # Rulează și când paritatea pică (vrem ambele rezultate), dar nu pe o schemă aplicată pe jumătate.
        if: ${{ !cancelled() && steps.start.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: supabase test db

      - name: Stop
        if: always()
        run: supabase stop --no-backup
